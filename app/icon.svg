<svg xmlns="http://www.w3.org/2000/svg" width="32" height="32" viewBox="0 0 32 32">
  <!--
    The same mark the sidebar header shows: lucide's GraduationCap in the primary
    foreground colour on a rounded square of the primary colour. The hex values are the
    sRGB equivalents of the primary and primary-foreground tokens in globals.css,
    written as hex because a favicon is rendered as a standalone image where oklch() is
    not dependable. The two colours swap under prefers-color-scheme: dark, as they do
    between the app's themes, so the square stays visible against a dark browser tab.

    The transform fits the cap's drawn extent, not its 24x24 viewBox. The drawn cap only
    occupies 22.1 by 16.1 of that box and sits centred at 11.97, 11.97, so scaling the box
    to fit the plate would waste a quarter of the width and leave the cap looking short at
    tab size. Scaling by the extent instead makes the cap 24 wide on the 32 plate.
  -->
  <style>
    .plate { fill: #171717; }
    .cap { stroke: #fafafa; }
    @media (prefers-color-scheme: dark) {
      .plate { fill: #e5e5e5; }
      .cap { stroke: #171717; }
    }
  </style>
  <rect class="plate" width="32" height="32" rx="6" />
  <g
    class="cap"
    transform="translate(3.02 3.02) scale(1.0845)"
    fill="none"
    stroke-width="2.1"
    stroke-linecap="round"
    stroke-linejoin="round"
  >
    <path d="M21.42 10.922a1 1 0 0 0-.019-1.838L12.83 5.18a2 2 0 0 0-1.66 0L2.6 9.08a1 1 0 0 0 0 1.832l8.57 3.908a2 2 0 0 0 1.66 0z" />
    <path d="M22 10v6" />
    <path d="M6 12.5V16a6 3 0 0 0 12 0v-3.5" />
  </g>
</svg>
